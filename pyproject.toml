[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlant-coder"
version = "0.2.0"
description = "Local coding agent and coordinated project generator with a terminal UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2,<9",
    "pydantic>=2,<3",
    "requests>=2.31,<3",
    "rich>=14,<16",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1,<2",
    "ruff>=0.11,<1",
    "PyYAML>=6,<7",
    "typing_extensions>=4.12,<5",
    "google-genai>=1.19,<2",
    "fake-useragent>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
atlant = "atlant_coder.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["atlant_coder*", "AurethosSDK*", "codex_gateway*"]

[tool.setuptools.package-data]
atlant_coder = ["models.json", "models/*.md", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
